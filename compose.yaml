name: relay-chat
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/deploy-vm.sh HOST first or set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  api:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_DRIVER: postgres
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,capacitor://localhost,http://localhost,https://localhost,relay://app}
      MESSAGE_RATE_LIMIT: ${MESSAGE_RATE_LIMIT:-120}
      MESSAGE_RATE_WINDOW_MS: ${MESSAGE_RATE_WINDOW_MS:-10000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-3000}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      TRUST_PROXY: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend, frontend]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [frontend]
volumes:
  postgres-data:
networks:
  backend: {internal: true}
  frontend: {}
